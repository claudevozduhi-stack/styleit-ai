# Проверки на каждый push и pull request: тесты, линтеры, типы, уязвимости и лицензии.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Установка зависимостей
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check . && ruff format --check .
      - name: Mypy
        run: mypy app scripts
      - name: Тесты
        run: pytest
      - name: Проверка каталога из data/
        run: python -m scripts.import_catalog --db /tmp/catalog.db
        # Пока таблицы каталога пустые, шаг не блокирует сборку.
        continue-on-error: true
      - name: Уязвимости зависимостей
        run: pip-audit --skip-editable
      - name: Лицензии рабочих зависимостей
        run: |
          python -m venv /tmp/prod && /tmp/prod/bin/pip install -q . pip-licenses
          /tmp/prod/bin/pip-licenses --partial-match --fail-on="GPL;Affero"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Тесты
        run: npm test
      - name: Сборка
        run: npm run build
      - name: Уязвимости зависимостей
        run: npm audit --omit=dev
      - name: Лицензии
        run: npm run licenses
