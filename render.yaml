# Render Blueprint: бэкенд StyleIt AI на бесплатном тарифе.
# Секреты (ANTHROPIC_API_KEY, GEMINI_API_KEY) и адрес фронтенда (CORS_ORIGINS) вводятся в панели Render, не в git.
services:
  - type: web
    name: styleit-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: AI_PROVIDER
        value: claude
      - key: ANTHROPIC_API_KEY
        sync: false
      # Сменить модель без правки кода, например на claude-sonnet-5-5
      - key: CLAUDE_MODEL
        value: claude-haiku-5-5
      # Запасной Gemini (AI_PROVIDER=gemini); ключ можно не задавать
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: CORS_ORIGINS
        sync: false
      # Превью Vercel своей команды, например https://styleit-ai-[a-z0-9-]+-<команда>\.vercel\.app
      - key: CORS_ORIGIN_REGEX
        sync: false
      - key: FREE_CAPSULES_PER_DAY
        value: "5"
      - key: RATE_LIMIT
        value: 30/minute
